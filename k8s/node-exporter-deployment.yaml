apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: node-exporter
        image: quay.io/prometheus/node-exporter:v1.6.1
        ports:
        - containerPort: 9100
        securityContext:
          allowPrivilegeEscalation: false
        args:
        - "--path.rootfs=/host"
        volumeMounts:
        - name: hostfs
          mountPath: /host
          readOnly: true
      volumes:
      - name: hostfs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  selector:
    app: node-exporter
  ports:
  - protocol: TCP
    port: 9100
    targetPort: 9100
